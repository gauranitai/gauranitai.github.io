<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canto 7–9 Summative Exam — Question Assignments</title>
<style>
  :root{
    --bg:#f7f4ee;
    --card:#ffffff;
    --ink:#2b2420;
    --sub:#6b6055;
    --line:#e4ddd0;
    --accent:#8a3b2e;
    --accent-soft:#f3e2dc;

    --hd:#8a3b2e;
    --hd-soft:#f6e3de;
    --rkd:#3b5e4b;
    --rkd-soft:#e2ecE4;
    --srdd:#2e5a8a;
    --srdd-soft:#dde8f4;
    --snad:#8a6d2e;
    --snad-soft:#f4ecdc;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.5;
  }
  header{
    padding:2.2rem 1.5rem 1.4rem;
    text-align:center;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#fffdf9,var(--bg));
  }
  header h1{
    margin:0 0 .3rem;
    font-size:1.7rem;
    letter-spacing:.02em;
  }
  header p.meta{
    margin:.2rem 0 0;
    color:var(--sub);
    font-size:.95rem;
    font-style:italic;
  }

  .layout{
    max-width:1100px;
    margin:0 auto;
    padding:1.6rem 1.2rem 4rem;
    display:grid;
    grid-template-columns:220px 1fr;
    gap:1.8rem;
  }
  @media (max-width: 780px){
    .layout{grid-template-columns:1fr;}
  }

  /* Sidebar */
  .sidebar{
    position:sticky;
    top:1rem;
    align-self:start;
  }
  .sidebar h2{
    font-size:.78rem;
    text-transform:uppercase;
    letter-spacing:.09em;
    color:var(--sub);
    margin:0 0 .6rem;
    font-weight:600;
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  .person-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    text-align:left;
    padding:.65rem .8rem;
    margin-bottom:.5rem;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:var(--card);
    cursor:pointer;
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:.95rem;
    font-weight:600;
    color:var(--ink);
    transition:.15s ease;
  }
  .person-btn .count{
    font-weight:400;
    font-size:.78rem;
    color:var(--sub);
    background:var(--bg);
    padding:.1rem .5rem;
    border-radius:20px;
  }
  .person-btn:hover{ transform:translateY(-1px); box-shadow:0 3px 10px rgba(0,0,0,.06); }
  .person-btn.active{ color:#fff; border-color:transparent; }
  .person-btn[data-person="HD"].active{ background:var(--hd); }
  .person-btn[data-person="RKD"].active{ background:var(--rkd); }
  .person-btn[data-person="SRDD"].active{ background:var(--srdd); }
  .person-btn[data-person="SNAD"].active{ background:var(--snad); }
  .person-btn.active .count{ background:rgba(255,255,255,.25); color:#fff; }

  .dot{
    display:inline-block;
    width:.6rem; height:.6rem;
    border-radius:50%;
    margin-right:.5rem;
    vertical-align:middle;
  }
  .dot.HD{background:var(--hd);}
  .dot.RKD{background:var(--rkd);}
  .dot.SRDD{background:var(--srdd);}
  .dot.SNAD{background:var(--snad);}

  #clearFilter{
    display:none;
    margin-top:.3rem;
    width:100%;
    padding:.5rem .8rem;
    border-radius:10px;
    border:1.5px dashed var(--sub);
    background:transparent;
    color:var(--sub);
    cursor:pointer;
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:.85rem;
  }

  .sidebar-note{
    margin-top:1.2rem;
    font-size:.8rem;
    color:var(--sub);
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.5;
  }

  /* Main */
  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:.5rem;
    margin-bottom:1.4rem;
    border-bottom:1px solid var(--line);
    padding-bottom:1rem;
  }
  .tab-btn{
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding:.5rem 1rem;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:var(--card);
    cursor:pointer;
    font-size:.88rem;
    font-weight:600;
    color:var(--ink);
  }
  .tab-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  .section-block{ display:none; }
  .section-block.active{ display:block; }
  .section-title{
    font-size:1.25rem;
    margin:0 0 .2rem;
  }
  .section-sub{
    color:var(--sub);
    font-size:.88rem;
    margin:0 0 1.2rem;
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }

  .q-card{
    background:var(--card);
    border:1px solid var(--line);
    border-left:5px solid var(--line);
    border-radius:10px;
    padding:1rem 1.2rem;
    margin-bottom:.9rem;
    box-shadow:0 1px 3px rgba(30,20,10,.04);
  }
  .q-card.HD{ border-left-color:var(--hd); }
  .q-card.RKD{ border-left-color:var(--rkd); }
  .q-card.SRDD{ border-left-color:var(--srdd); }
  .q-card.SNAD{ border-left-color:var(--snad); }
  .q-card.dimmed{ opacity:.28; }

  .q-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:.8rem;
    margin-bottom:.4rem;
  }
  .q-num{
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:.78rem;
    color:var(--sub);
    font-weight:600;
    white-space:nowrap;
  }
  .badge{
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.03em;
    padding:.22rem .6rem;
    border-radius:999px;
    white-space:nowrap;
    cursor:pointer;
    border:none;
  }
  .badge.HD{ background:var(--hd-soft); color:var(--hd); }
  .badge.RKD{ background:var(--rkd-soft); color:var(--rkd); }
  .badge.SRDD{ background:var(--srdd-soft); color:var(--srdd); }
  .badge.SNAD{ background:var(--snad-soft); color:var(--snad); }

  .q-text{ font-size:.97rem; margin:0; }
  .q-text .sub-list{ margin:.4rem 0 0 1.1rem; padding:0; font-size:.94rem; }

  .my-questions-banner{
    display:none;
    align-items:center;
    justify-content:space-between;
    background:var(--accent-soft);
    border:1px solid var(--accent);
    border-radius:10px;
    padding:.7rem 1rem;
    margin-bottom:1.2rem;
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:.9rem;
  }
  .my-questions-banner strong{ color:var(--accent); }
</style>
</head>
<body>

<header>
  <h1>Canto 7–9 Summative Exam</h1>
  <p class="meta">Question bank, organized by section · assigned across HD · RKD · SRDD · SNAD</p>
</header>

<div class="layout">
  <aside class="sidebar">
    <h2>Assigned To</h2>
    <button class="person-btn" data-person="HD"><span><span class="dot HD"></span>HD</span><span class="count"></span></button>
    <button class="person-btn" data-person="RKD"><span><span class="dot RKD"></span>RKD</span><span class="count"></span></button>
    <button class="person-btn" data-person="SRDD"><span><span class="dot SRDD"></span>SRDD</span><span class="count"></span></button>
    <button class="person-btn" data-person="SNAD"><span><span class="dot SNAD"></span>SNAD</span><span class="count"></span></button>
    <button id="clearFilter">Show everyone</button>
    <p class="sidebar-note">Click a name to see only that person's questions across every section. Click again (or "Show everyone") to clear.</p>
  </aside>

  <main>
    <nav class="tabs" id="tabs"></nav>

    <div class="my-questions-banner" id="myQBanner">
      <span>Showing questions assigned to <strong id="myQName"></strong></span>
    </div>

    <div id="sections"></div>
  </main>
</div>

<script>
const PEOPLE = ["HD","RKD","SRDD","SNAD"];

const DATA = [
  {
    key: "canto7",
    label: "Canto 7",
    sub: "12 questions in the bank — 2 out of 5 to be answered from this section",
    questions: [
      "Explain the philosophical implications of the Supreme Lord being equal to everyone, even though by killing demons He appears to show partiality to the demigods. Discuss how this principle influences the understanding of divinity and morality in vaishnava philosophy with reference to the 7th Canto Chapter 1.",
      "Analyze Canto Seven into Chapter groupings including a description of how they develop out of the dialogs, activities and instructions from the previous Canto. Include the doubt that Maharaj Pariksit has about events in Canto Six, and how Sukadeva Goswami addresses it in this Canto.",
      "With reference to Srimad Bhagavatam Canto 7, Chapters 2–4, analyze Hiranyakaśipu's character and describe his quest for immortality including his type of austerities, the benedictions he requested and his attack on brahminical culture. What does this tell us about the nature of desire and the pursuit of power?",
      "Summarise and draw general principles relevant for preaching Krsna consciousness from Sri Prahlāda's statements as follows: 7.5.5 "tat sādhu manye 'sura-varya dehināṁ", 7.5.23–24 "śravaṇaṁ kīrtanaṁ viṣṇoḥ" and 7.5.30–32 "matir na kṛṣṇe parataḥ svato vā". Describe the circumstances wherein Prahlāda Maharaja made these statements, and Hiranyakaśipu's response.",
      "Why did the so-called brāhmaṇas Sanda and Amarka become chastised and threaten Prahlāda Maharaja? What general principles, relevant for modern education and education in ISKCON, can we draw from these incidents described in Canto 7 Chapter 5 of Srimad Bhagavatam?",
      "Explain Prahlāda Maharaja's statement beginning "kaumāra ācaret prājno..." (7.6.1) and discuss its significance. Select 3 of Prahlāda's instructions to his demoniac schoolmates, in Canto 7 Chapter 6 of Srimad Bhagavatam, and discuss their relevance for Krsna conscious grhasthas.",
      "Summarize the teachings imparted by Prahlada Maharaja to his demoniac schoolmates in Canto 7 Chapter 6. How do these teachings challenge the conventional wisdom of materialistic society?",
      "With reference to Chapters 7 & 8, summarise the conversation between Prahlāda and Hiranyakaśipu prior to the appearance of Lord Nrsimhadeva. Briefly describe Lord Nrsimhadeva's appearance and His killing Hiranyakaśipu and the demons.",
      "Draw general principles, relevant for members of the Krsna Consciousness movement, from Sri Prahlāda's prayer and Srila Prabhupada's purport to 7.9.44: "prāyeṇa deva munayaḥ sva-vimukti-kāmāḥ".",
      "The 7th Canto presents the story of Lord Nrsimhadeva's rescue of His devotee Prahlada. Discuss the philosophical significance of this narrative in the context of divine intervention and the relationship between the Supreme Lord and the devotees.",
      "Summarise, and discuss the significance of, Sri Prahlāda's statements in Chapter 10 verses 1–17, responding to Lord Nrsimhadeva offering him any benediction that he may desire.",
      "Srila Prabhupada comments in the purport to 7.11.2: "This eternal occupational duty can be organized through the institution of varṇāśrama, in which there are four varṇas (brāhmaṇa, kṣatriya, vaiśya and śūdra) and four āśramas (brahmacarya, gṛhastha, vānaprastha and sannyāsa). Thus, Yudhiṣṭhira Mahārāja inquired from Nārada Muni about the principles of sanātana-dharma for the benefit of human society." Discuss this statement and explain how this perfect society aims to achieve harmony and spiritual progress in human society."
    ]
  },
  {
    key: "canto8",
    label: "Canto 8",
    sub: "12 questions in the bank — 2 out of 5 to be answered from this section",
    questions: [
      "With reference to three pastimes from Canto 8, compare the characteristics of both devotees and demons and discuss what these pastimes tell us about how devotees are favoured by the Lord and the nature of good and evil.",
      "Srila Prabhupada writes in purport to 8.2.30: "The soldiers in this Kṛṣṇa consciousness movement must always possess physical strength, enthusiasm and sensual power. To keep themselves fit, they must therefore place themselves in a normal condition of life. What constitutes a normal condition will not be the same for everyone, and therefore there are divisions of varṇāśrama." Discuss the application of this statement in your personal life and in ISKCON. Give reference to Gajendra's crisis and his prayers as described in Chapters 2 and 3 of Canto 8.",
      "Describe the incident of the churning of the Milk Ocean, its symbolic meaning and the demigods making a truce with the demons, as described in Chapters 6–8, Canto 8 of Srimad Bhagavatam. Discuss the relevance of this pastime for leaders and preachers of Krsna consciousness.",
      "Describe the pastime of the Lord incarnating as Mohini Murti, distributing nectar to the demigods and bewildering Lord Siva, as found in Chapters 9 to 12 of Canto 8. Discuss the philosophical implications of this pastime and how the story of Mohini Murti illustrates the power of illusion.",
      "Discuss this Canto in terms of preaching to the Scientific Mentality, addressing doubts that pastimes might give to the modern scientific mind, such as mountains flying in the sky (8.11.12) and the Vedic order of the planets (8.18.5). Discuss how the Bhagavata perspective explains modern scientific problems and develops topics such as Sankhya, cosmology, economics and ecology. (Study resource: "Vedic Cosmography and Astronomy" by Richard L. Thompson.)",
      "Srila Prabhupada writes in purport to 8.19.21: "The Kṛṣṇa consciousness movement is therefore establishing various farms, especially in America, to show how to be happy and content with minimum necessities of life and to save time for self-realization." Discuss strategies ISKCON can adopt to further develop farming projects toward this end. Give reference to Srimad Bhagavatam and the bhakti sastras in your response.",
      "With reference to Chapters 18 to 22, Canto 8 of Srimad Bhagavatam, briefly describe the pastime of Vamandeva begging charity from Bali Maharaja, covering the entire universe with His three steps and sending Bali to the Sutala planet. Discuss how this pastime illustrates the concept of surrender to God in the Bhagavatam and other traditions, and how the principles of surrender demonstrated by Bali Maharaja can be applied in everyday life.",
      "Parīkṣit Mahārāja's question to Śukadeva Gosvāmī in 8.24.2–3: "What was the purpose for which the Supreme Personality of Godhead accepted the abominable form of a fish, exactly as an ordinary living being accepts different forms under the laws of karma? The form of a fish is certainly condemned and full of terrible pain. O my lord, what was the purpose of this incarnation?" Describe the two Matsya avataras, as found in Canto 8 Chapter 24 of Srimad Bhagavatam, and explain why the Lord incarnated in the form of a fish.",
      "Select at least three personalities mentioned in Canto 8, such as Harischandra, Aditi, et al., and describe how they demonstrate virtues such as truthfulness, integrity, humility, etc.",
      "Discuss the role of Lord Śiva in the 8th Canto. How does his interaction with the demigods and demons illustrate his unique position within the Vaishnava pantheon?",
      "Analyse Canto 8 into Chapter groupings by content, and explain how this Canto fits into the general structure of the Srimad Bhagavatam.",
      "Select and illuminate specific prayers to Krsna and His incarnations in this Canto, including explanation of the time and circumstances that involve: (i) an elephant, (ii) a dwarf, (iii) an apparent prostitute, (iv) Lord Brahma, (v) Satyavrata Muni, (vi) the Prajapatis offering poison to someone, (vii) a fish, twice, (viii) Lord Siva, (ix) Kasyapa to Aditi, (x) Aditi to Visnu. Mention any general content or principles of glorification that you see in the prayers, and identify any famous verses amongst them."
    ]
  },
  {
    key: "canto9",
    label: "Canto 9",
    sub: "11 questions in the bank — 2 to be answered from this section",
    questions: [
      "How does Canto 9 continue the discussion of the Manus from Canto 8? What question does Maharaja Pariksit ask to stimulate this explanation? If we divide Canto Nine into a description of two dynasties, what are they, and into which ones do Rama, Krsna, Ambarisa and Yayati fall?",
      "Identify and discuss the main themes presented in the 9th Canto. How do these themes contribute to the overall message of the Srimad Bhagavatam? [Select two of the following main themes]: Sarga, Visarga, Sthanam, Posanam, Uti, Manvantara, Isanukatha, Nirodha, Mukti, Asraya.",
      "Briefly describe any three of the following pastimes from Canto Nine, drawing principles relevant to cultivation of Vaishnava behavior and preaching Lord Caitanya's movement. In general, explain how these pastimes can be promoted as historical facts in spite of contrasting scientific theories: (I) Ambarisa Maharaja being offended by Durvasa Muni; (II) downfall of Saubhari Muni; (III) King Bhagiratha bringing Ganga Devi to earth to deliver his forefathers; (IV) Parasurama killing the sons of Kartaviryarjuna and other ksatriyas; (V) Cyavana and Sukanya; (VI) Yayati becoming old and his son Puru accepting his father's old age; (VII) pastimes of the Supreme Lord Ramacandra.",
      "Discuss the principles of truthfulness and integrity, as demonstrated by King Harishchandra in the 9th Canto. How can we practice these virtues in our own actions and decisions?",
      "Discuss the relevance of selfless service for ISKCON congregations and leaders in ISKCON, with reference to the story of King Rantideva in the 9th Canto.",
      "The 9th Canto contains the story of King Ambarisha and Durvasa Muni. Analyze this story and discuss what it reveals about the power of devotion and the consequences of offending a devotee.",
      "Discuss how the narrative of the Yadu dynasty, described at the end of the 9th Canto, sets the stage for the appearance of Lord Krishna in the 10th Canto.",
      "Analyze the concept of humility with reference to the pastimes of Devayani, Sagara Maharaja and Durvasa. Discuss how we can apply this virtue in our personal and practical vocational lives.",
      "Select one of the following three prayers from Canto 9 and discuss their literary and poetic ornaments, and their relevance to your personal Sadhana and the Sankirtan Movement. Describe the character of the person praying and to whom the prayer is offered, and the circumstances, goal and some of the specific content: 9.5.3–11 (Ambarisa Maharaja's prayers to Sudarsan chakra); 9.11.5–7 (Prayers of the Brahmanas to Lord Ramacandra); 9.8.21–26 (Prayers to Lord Kapiladev).",
      "This Canto is full of lessons about grhastha life, grhamedhi problems, stri-dharma (religious principles for women), etc. Explain some of them and discuss practical lessons for guiding ISKCON communities that we can draw from them, for example: (i) Cyavana and Sukanya; (ii) Yayati, Sarmistha, their father and goats; (iii) the King and the Apsara; (iv) Sita and Rama.",
      "Analyze the character development of one or more key figures in the 9th Canto. How does this character's journey reflect the principles of Bhakti yoga?"
    ]
  },
  {
    key: "thematic",
    label: "Thematic (7–9)",
    sub: "9 questions in the bank — 1 out of 5 to be answered from this section",
    questions: [
      "Select any Canto from Cantos 7–9 and divide it into chapter groupings by content, explaining how this Canto fits into the general structure of the Srimad Bhagavatam.",
      "Discuss sections from Cantos 7–9 in terms of preaching to the Scientific Mentality, addressing the doubts that specific statements from the Srimad Bhagavatam might give to the modern scientific mind. Analyse how the Srimad Bhagavatam explains modern scientific problems through topics such as Sankhya, cosmology, economics and ecology.",
      "Discuss Cantos 7–9 in terms of Daivi-varnashrama Dharma. Discuss its relevance for application in ISKCON and organizing broader society. (Note: teacher may add specific reference to appropriate sections.)",
      "Discuss Cantos 7–9 in terms of the Yoga-ladder from Karma to Jnana to Bhakti-yoga as analyzed in this section of Srimad Bhagavatam, with details of specific incidents.",
      "Which of the stages of bhakti — adau sraddha, sadhu sanga — in relation to 1st, 2nd and 3rd class devotees, are discussed in Cantos 7–9, and why?",
      "Discuss Guru-tattva, with reference to specific incidents from Cantos 7–9.",
      "Identify the different angas of bhakti and explain how they are emphasised in different incidents from Cantos 7–9.",
      "Discuss specific prayers from this section and discuss how they affect your spiritual development as well as the development of ISKCON in general.",
      "Select from these Nectar of Instruction quoted verses to build a sastric basis for your Uttama-adhikari spiritual life. Explain why they are such key verses in our philosophy with reference to Nectar of Instruction and the Srimad Bhagavatam, Cantos 7–9: (i) Sikshastaka 1 & 4; (ii) BRS 1.2.234 — Atah sri Krsna...; (iii) BG 18.66; (iv) SB 5.5.4 — Nunam pramattah; (v) SB 7.5.30 — Matir na krsne; (vi) BG 14.26 — Mam ca yo 'vyabhicarena; (vii) BG 7.19 — bahunam janmanam; (viii) SB 7.5.23 — sravanam kirtanam smaranam; (ix) BRS 1.1.11 — anyabhilasita sunyam; (x) CC 2.22.32 — Krsna surya sama; (xi) SB 5.18.12 — yasyasti bhaktir; (xii) BG 9.13 — mahatmanas tu; (xiii) CC Madhya 20.108–109, CC Madhya 22.24 — krsnera 'nitya-dasa'; (xiv) BG 4.34 — tad viddhi pranipatena; (xv) BG 9.21 — ksine punye martya-lokam visanti."
    ]
  }
];

// Assign people round-robin continuously across ALL sections (not reset per
// section), so the overall total per person comes out equal. With 44
// questions and 4 people that's 11 each; if the total weren't evenly
// divisible, continuing the same cycle across sections naturally hands the
// leftover questions to the people at the bottom of the order first.
let __globalIdx = 0;
DATA.forEach(section => {
  section.questions = section.questions.map(text => ({
    text,
    person: PEOPLE[__globalIdx++ % PEOPLE.length]
  }));
});

let activeTab = DATA[0].key;
let activePerson = null;

const tabsEl = document.getElementById("tabs");
const sectionsEl = document.getElementById("sections");
const bannerEl = document.getElementById("myQBanner");
const bannerName = document.getElementById("myQName");

function personCount(person){
  let n = 0;
  DATA.forEach(s => s.questions.forEach(q => { if (q.person === person) n++; }));
  return n;
}

function renderTabs(){
  tabsEl.innerHTML = "";
  DATA.forEach(section => {
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (section.key === activeTab ? " active" : "");
    btn.textContent = section.label;
    btn.onclick = () => { activeTab = section.key; render(); };
    tabsEl.appendChild(btn);
  });
}

function renderSections(){
  sectionsEl.innerHTML = "";
  DATA.forEach(section => {
    const block = document.createElement("div");
    block.className = "section-block" + (section.key === activeTab ? " active" : "");

    const title = document.createElement("h2");
    title.className = "section-title";
    title.textContent = section.label;
    block.appendChild(title);

    const sub = document.createElement("p");
    sub.className = "section-sub";
    sub.textContent = section.sub;
    block.appendChild(sub);

    section.questions.forEach((q, i) => {
      const card = document.createElement("div");
      card.className = "q-card " + q.person;
      if (activePerson && q.person !== activePerson) card.classList.add("dimmed");

      const head = document.createElement("div");
      head.className = "q-head";

      const num = document.createElement("span");
      num.className = "q-num";
      num.textContent = section.label + " · Q" + (i + 1);
      head.appendChild(num);

      const badge = document.createElement("button");
      badge.className = "badge " + q.person;
      badge.textContent = q.person;
      badge.onclick = () => togglePerson(q.person);
      head.appendChild(badge);

      card.appendChild(head);

      const text = document.createElement("p");
      text.className = "q-text";
      text.textContent = q.text;
      card.appendChild(text);

      block.appendChild(card);
    });

    sectionsEl.appendChild(block);
  });
}

function renderSidebar(){
  document.querySelectorAll(".person-btn").forEach(btn => {
    const p = btn.dataset.person;
    btn.querySelector(".count").textContent = personCount(p) + " q";
    btn.classList.toggle("active", activePerson === p);
  });
  document.getElementById("clearFilter").style.display = activePerson ? "block" : "none";

  if (activePerson){
    bannerEl.style.display = "flex";
    bannerName.textContent = activePerson;
  } else {
    bannerEl.style.display = "none";
  }
}

function togglePerson(person){
  activePerson = (activePerson === person) ? null : person;
  render();
}

function render(){
  renderTabs();
  renderSections();
  renderSidebar();
}

document.querySelectorAll(".person-btn").forEach(btn => {
  btn.addEventListener("click", () => togglePerson(btn.dataset.person));
});
document.getElementById("clearFilter").addEventListener("click", () => { activePerson = null; render(); });

render();
</script>

</body>
