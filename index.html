<!DOCTYPE html>
<html>
<head>
    <title>My GitHub Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        nav {
            width: 200px;
            background-color: #333;
            color: white;
            padding: 20px;
            overflow-y: auto;
        }
        
        nav h2 {
            margin-bottom: 20px;
            font-size: 18px;
        }
        
        nav ul {
            list-style: none;
        }
        
        nav li {
            margin-bottom: 10px;
        }
        
        nav a {
            color: #4da6ff;
            text-decoration: none;
            display: block;
            padding: 8px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        
        nav a:hover {
            background-color: #555;
        }
        
        #content {
            flex: 1;
            overflow: auto;
        }
    </style>
</head>
<body>
    <nav>
        <h2>Navigation</h2>
        <ul id="navList">
            <li><a href="index.html" target="content">Home</a></li>
        </ul>
    </nav>
    
    <iframe id="content" name="content"></iframe>
    
    <script>
        // Find all .Person.html files and add them to navigation
        const navList = document.getElementById('navList');
        
        // Array to store found Person files
        const personFiles = [];
        
        // Search for .Person.html files in the repository
        // This will look for common naming patterns
        const possibleNames = [
            'John.Person.html',
            'Jane.Person.html',
            'Alice.Person.html',
            'Bob.Person.html',
            'Charlie.Person.html',
            'Diana.Person.html',
            'Eve.Person.html',
            'Frank.Person.html'
        ];
        
        // Function to check if file exists and add to nav
        async function checkAndAddFile(filename) {
            try {
                const response = await fetch(filename, { method: 'HEAD' });
                if (response.ok) {
                    const displayName = filename.replace('.Person.html', '');
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = filename;
                    a.textContent = displayName;
                    a.target = 'content';
                    li.appendChild(a);
                    navList.appendChild(li);
                }
            } catch (error) {
                // File doesn't exist, skip
            }
        }
        
        // Check for all possible Person files
        possibleNames.forEach(filename => {
            checkAndAddFile(filename);
        });
        
        // Set default content
        document.getElementById('content').src = 'index.html';
    </script>
</body>
</html>
